<script>
(function(){

const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:null};

function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e}

const pad2=n=>String(n).padStart(2,'0');
let anDoc=null,anSym=null;
try{anSym=localStorage.getItem('site-an')}catch(e){}
const SVGNS='http://www.w3.org/2000/svg';
function s(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs||{}))if(v!=null)e.setAttribute(k,v);for(const k of kids)if(k!=null)e.append(k.nodeType?k:document.createTextNode(String(k)));return e}
const ZK={res:'저항',sup:'지지',liq:'유동성',fvg:'FVG',gamma:'감마'};
function digitsFor(sym){return 1}
const fmtL=v=>v==null?'–':Number.isInteger(v)?fmt(v,0):fmt(v,1);
function drawChart(it){
  const W=Math.max(300,Math.min(720,Math.round($('anBody').clientWidth||480))),H=W<520?260:300,padL=6,padR=82,padT=10,padB=22;
  const cs=(it.candles||[]).filter(c=>Array.isArray(c)&&c.length>=5);
  if(cs.length<5)return null;
  const fut=24,n=cs.length+fut,cw=(W-padL-padR)/n;
  let lo=Math.min(...cs.map(c=>c[3])),hi=Math.max(...cs.map(c=>c[2]));
  const span=hi-lo||1;
  const zones=(it.zones||[]).filter(z=>num(z.lo)!=null&&num(z.hi)!=null&&z.hi>=lo-span*.6&&z.lo<=hi+span*.6);
  const paths=(it.scenarios||[]).filter(p=>Array.isArray(p.path)&&p.path.length);
  for(const z of zones){lo=Math.min(lo,z.lo);hi=Math.max(hi,z.hi)}
  for(const p of paths)for(const v of p.path){if(num(v)!=null&&Math.abs(v-cs.at(-1)[4])<span*1.2){lo=Math.min(lo,v);hi=Math.max(hi,v)}}
  const m=(hi-lo)*.04;lo-=m;hi+=m;
  const y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);
  const x=i=>padL+cw*(i+.5);
  const g=s('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':(it.symbol||'')+' 1시간봉 차트와 핵심 구간'});
  // zones
  const lastP=cs.at(-1)[4];const labs=[{y:y(lastP)+4,text:fmt(num(it.price)??lastP,digitsFor(it.symbol)),attrs:{style:'fill:var(--ink);font-weight:600'}}];
  for(const z of zones){const k=ZK[z.kind]?z.kind:'fvg';const y1=y(z.hi),y2=y(z.lo);
    g.append(s('rect',{x:padL,y:y1,width:W-padL-padR,height:Math.max(2,y2-y1),class:'z-'+k}));
    labs.push({y:(y1+y2)/2+4,text:(z.label||ZK[k]).slice(0,8),attrs:{class:'zl t-'+k}})}
  // candles
  cs.forEach((c,i)=>{const up=c[4]>=c[1],cl=up?'cu':'cd';
    g.append(s('line',{x1:x(i),x2:x(i),y1:y(c[2]),y2:y(c[3]),class:cl+' wick'}));
    const top=y(Math.max(c[1],c[4])),bh=Math.max(1,Math.abs(y(c[1])-y(c[4])));
    g.append(s('rect',{x:x(i)-cw*.35,y:top,width:Math.max(1,cw*.7),height:bh,class:cl}))});
  // last price
  const last=cs.at(-1)[4];
  g.append(s('line',{x1:padL,x2:W-padR,y1:y(last),y2:y(last),class:'px-line'}));
  // right-edge labels: keep price order, push apart to a 13px minimum gap, then pull back inside the plot
  labs.sort((a,b)=>a.y-b.y);const GAP=13;
  for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<GAP)labs[i].y=labs[i-1].y+GAP;
  const over=labs.length?labs.at(-1).y-(H-padB):0;if(over>0)for(let i=labs.length-1;i>=0;i--){labs[i].y-=over;if(i>0&&labs[i].y-labs[i-1].y>=GAP)break;if(i>0)labs[i-1].y=Math.min(labs[i-1].y,labs[i].y-GAP)}
  for(const l of labs)g.append(s('text',{x:W-padR+4,y:Math.max(padT+8,l.y),...l.attrs},l.text));
  // scenario paths
  for(const p of paths){const d=p.dir==='long'||p.dir==='short'?p.dir:'wait';const step=fut/p.path.length;
    const pts=[[x(cs.length-1),y(last)],...p.path.map((v,j)=>[x(cs.length-1+step*(j+1)),y(v)])];
    g.append(s('polyline',{points:pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' '),class:'path path-'+d}));
    const e=pts.at(-1);g.append(s('text',{x:e[0]-4,y:e[1]-5,'text-anchor':'end',class:'zl',style:`fill:var(--${d==='long'?'good':d==='short'?'bad':'muted'})`},(p.name||'').split(' ')[0].slice(0,3)))}
  // time ticks (KST)

}
function normAn(d){if(!d||!Array.isArray(d.items))return d;d.items=d.items.filter(it=>it&&it.symbol).map(it=>({...it,price:num(it.price),
  zones:(Array.isArray(it.zones)?it.zones:[]).map(z=>{const a=num(z.lo),b=num(z.hi)??a;return{...z,lo:Math.min(a??b,b),hi:Math.max(a??b,b)}}).filter(z=>z.lo!=null&&isFinite(z.lo)),
  scenarios:(Array.isArray(it.scenarios)?it.scenarios:[]).map(p=>({...p,entry:num(p.entry),sl:num(p.sl),tp:Array.isArray(p.tp)?p.tp.map(num):[],path:Array.isArray(p.path)?p.path.map(num).filter(v=>v!=null):[]}))}));return d}

function renderAnalysis(){
  const body=$('anBody'),tabsEl=$('anTabs');
  const items=(anDoc&&Array.isArray(anDoc.items))?anDoc.items:[];
  tabsEl.replaceChildren();
  if(!items.length){body.replaceChildren(h('div',{class:'empty',text:'평일 아침 7시 46분에 자동으로 채워져요. 아직 받은 분석이 없어요.'}));$('anStamp').textContent='';return}
  const old=false;
  $('anStamp').textContent=(anDoc.date||'')+(anDoc.generatedAt?' '+new Date(anDoc.generatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'')+(old?' · 지난 분석':'');
  if(!items.some(it=>it.symbol===anSym))anSym=items[0].symbol;
  for(const it of items){tabsEl.append(h('button',{type:'button',role:'tab','aria-pressed':String(it.symbol===anSym),text:it.symbol,onclick:()=>{anSym=it.symbol;try{localStorage.setItem('site-an',anSym)}catch(e){}renderAnalysis()}}))}
  const it=items.find(x=>x.symbol===anSym);const dg=digitsFor(it.symbol);
  const bcls=it.bias==='상승'?'up':it.bias==='하락'?'down':'flat';
  const kids=[];
  if(old)kids.push(h('div',{class:'banner warn',text:'오늘 분석이 아직 없어 가장 최근 분석을 보여 주고 있어요.'}));
  kids.push(h('div',{class:'an-top'},h('span',{class:'an-price',text:num(it.price)!=null?fmt(it.price,dg):'–'}),h('span',{class:'bias '+bcls,text:it.bias==='상승'||it.bias==='하락'?it.bias+' 우위':'중립 · 박스'}),h('span',{class:'hint',text:it.asOf||''})));
  if(it.headline)kids.push(h('p',{class:'an-headline',text:it.headline}));
  const ch=drawChart(it);
  if(ch){kids.push(ch);kids.push(h('div',{class:'legend'},...[['res','저항','var(--bad)'],['sup','지지','var(--good)'],['liq','유동성 $$$','var(--accent)'],['gamma','감마 노드','#7d6be0'],['fvg','FVG','var(--muted)']].map(([,t,c])=>h('span',null,h('i',{style:'background:'+c+';opacity:.5'}),t)),h('span',{text:'점선 = 시나리오 예상 경로'})))}
  if(it.summary)kids.push(h('p',{class:'an-sum',text:it.summary}));
  const zs=(it.zones||[]).slice().sort((a,b)=>(num(b.hi)||0)-(num(a.hi)||0));
  if(zs.length){kids.push(h('h3',{text:'핵심 구간 (위에서 아래로)'}));kids.push(h('div',{class:'zones'},...zs.map(z=>h('div',{class:'zone '+(z.kind||'')},h('b',{text:(z.lo===z.hi?fmtL(z.lo):fmtL(z.lo)+'–'+fmtL(z.hi))}),h('span',{text:(ZK[z.kind]||'')+(z.label?' · '+z.label:'')}),z.why?h('p',{text:z.why}):null))))}
  const sc=it.scenarios||[];
  if(sc.length){kids.push(h('h3',{text:'시나리오'}));kids.push(h('div',{class:'scen'},...sc.map(p=>{const d=p.dir==='long'||p.dir==='short'?p.dir:'wait';
    const tp=Array.isArray(p.tp)?p.tp.filter(v=>num(v)!=null).map(fmtL).join(' / '):'';
    return h('div',{class:'sc '+d},h('div',{class:'sc-t',text:(p.name||'')+' · '+(d==='long'?'매수':d==='short'?'매도':'관망')}),p.trigger?h('p',{text:'조건: '+p.trigger}):null,
      (num(p.entry)!=null||num(p.sl)!=null||tp)?h('div',{class:'calc'},h('div',null,h('span',{text:'진입'}),h('b',{text:fmtL(p.entry)})),h('div',null,h('span',{text:'손절'}),h('b',{text:fmtL(p.sl)})),h('div',null,h('span',{text:'익절'}),h('b',{text:tp||'–'}))):null,
      p.why?h('p',{class:'hint',text:p.why}):null)})))}
  if(it.invalid)kids.push(h('p',{class:'hint',text:'무효 조건: '+it.invalid}));
  const foot=[anDoc.macro,anDoc.dataNote].filter(Boolean).join('\n');
  if(foot)kids.push(h('p',{class:'hint',style:'white-space:pre-line',text:foot}));
  body.replaceChildren(...kids);
}

async function load(){
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;anDoc=normAn(await r.json());renderAnalysis();
    const d=new Date();$('todayLabel').textContent=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
  catch(e){$('anBody').replaceChildren(h('div',{class:'empty',text:'분석을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'}))}
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(anDoc)renderAnalysis()},200)});
load();setInterval(load,10*60*1000);
})();
</script></body></html>
